[package]
name = "core-to-core-latency"
description = "Measures CPU core-to-core latency"
authors = ["Nicolas Viennot <nicolas@viennot.com>"]
repository = "https://github.com/nviennot/core-to-core-latency"
license = "MIT"
readme = "README.md"
version = "1.2.0"
edition = "2021"
exclude = ["/results"]

[dependencies]
core_affinity = "0.8.3"
quanta = "0.10"
clap = { version = "3", features = ["derive"] }
ndarray = "0.15"
ansi_term = "0.12"
ordered-float = "3"
cache-padded = "1.2"
crossbeam-utils = { version = "0.8", default-features = false }
raw-cpuid = "10"
libc = { version = "0.2", optional = true }

[features]
# Optional, Linux-only NUMA-aware memory placement (--numa). Enables the libc
# crate for raw mmap/mbind/move_pages/sysconf syscalls. No system libnuma and no
# build.rs. Without this feature --numa errors asking to rebuild, and behavior is
# identical to a non-NUMA build.
numa = ["dep:libc"]
